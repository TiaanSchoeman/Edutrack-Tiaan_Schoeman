<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edutrack | Uploads</title>
  <link rel="stylesheet" href="CSS/admin.css" />
  <script src="https://kit.fontawesome.com/d6e9d7304f.js" crossorigin="anonymous"></script>
</head>
<body class="uploads">

<aside class="sidebar">
  <div>
    <div class="logo">
      <img src="https://i.pinimg.com/736x/27/d6/ad/27d6ad0843c149d09f5cbf1baf20b631.jpg" alt="logo" />
      <h2>Edutrack</h2>
    </div>
    <nav>
      <a href="dashboard.html"><i class="fa-solid fa-house"></i> Dashboard</a>
      <a href="uploadpage.html" class="active"><i class="fa-solid fa-circle-up"></i> Uploads</a>
      <a href="downloadpage.html"><i class="fa-regular fa-circle-down"></i> Downloads</a>
      <a href="resourcespage.html"><i class="fa-solid fa-file"></i> Resources</a>
      <a href="profile.html"><i class="fa-solid fa-user"></i> Profile</a>
      <a href="contactpage.html"><i class="fa-solid fa-comment"></i> Contact</a>
    </nav>
  </div>
  <button class="logout-btn" onclick="logoutUser()"><i class="fa-regular fa-circle-xmark"></i> Logout</button>
</aside>

<main class="main-content">
  <header>
    <h1>Upload Assessments</h1>
  </header>

  <section class="upload-section">
    <div class="upload-area" id="uploadArea">
      <p><i class="fa-solid fa-folder-open"></i> Drag & Drop files here or click to select</p>
      <input type="file" id="fileInput" hidden multiple />
    </div>

    <div class="progress-container">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <p class="upload-message" id="uploadMessage"></p>

    <div class="filter-bar">
      <input type="text" id="searchInput" placeholder="Search files..." />
      <select id="fileCategory">
        <option value="All">All Categories</option>
        <option value="Assignment">Assignments</option>
        <option value="Notes">Notes</option>
        <option value="Exam">Exams</option>
      </select>
    </div>

    <div class="uploaded-list">
      <table id="uploadedTable">
        <thead>
          <tr>
            <th>File Name</th>
            <th>Size</th>
            <th>Category</th>
            <th>Date Uploaded</th>
            <th>Uploaded By</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </section>
</main>

<!-- Firebase + Admin JS -->
<script type="module" src="../firebase.js"></script>
<script type="module" src="JS/admin.js"></script>

</body>
</html>
